# kind publishes these NodePorts on 127.0.0.1 (deploy/kind/cluster.yaml).
apiVersion: v1
kind: Service
metadata:
  name: web-nodeport
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: web }
  ports: [{ name: http, port: 8080, targetPort: 8080, nodePort: 30108 }]
---
apiVersion: v1
kind: Service
metadata:
  name: api-nodeport
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: api }
  ports: [{ name: http, port: 8080, targetPort: 8080, nodePort: 30228 }]
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-management-nodeport
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: rabbitmq }
  ports: [{ name: management, port: 15672, targetPort: 15672, nodePort: 30718 }]
