apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flash
resources:
  - ../../base
  - nodeports.yaml
# Demo secrets, generated by scripts/kind-secrets.sh into secrets.env (git-ignored). A real cluster brings its own Secret
# (External Secrets, Sealed Secrets, a cloud secret manager) under the same name and keys.
secretGenerator:
  - name: flash-secrets
    envs: [secrets.env]
    options: { disableNameSuffixHash: true }
patches:
  - target: { kind: ConfigMap, name: flash-config }
    patch: |-
      - { op: replace, path: /data/AUTH_REQUIRE_CONFIRMED_EMAIL, value: "false" }
      - { op: replace, path: /data/MAIL_DEV_MAILBOX, value: "true" }
      - { op: replace, path: /data/RATE_LIMIT_AUTH_PER_MINUTE, value: "1000" }
      - { op: replace, path: /data/JWT_REVOCATION_CACHE_SECONDS, value: "2" }
      - { op: replace, path: /data/ORDERS_FINAL_MARK_DELAY_MS, value: "1500" }
      - { op: replace, path: /data/DEALS_HOLD_SECONDS, value: "12" }
      - { op: replace, path: /data/DEALS_SWEEP_INTERVAL_MS, value: "500" }
      - { op: replace, path: /data/AUTH_PUBLIC_URL, value: "http://127.0.0.1:8112" }
