# The data stores talk to the API pods and to nothing else (kind's kindnet enforces NetworkPolicy, as do Calico, Cilium and
# the cloud CNIs). The one exception is the RabbitMQ management UI on 15672, which stays reachable so an operator can look
# at the queues; in a real cluster expose it only through an authenticated ingress or a port-forward.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-stores-accept-only-the-api
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [postgres, kafka, rabbitmq] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: api }
        - podSelector:
            matchLabels: { app.kubernetes.io/name: rabbitmq }
        - podSelector:
            matchLabels: { app.kubernetes.io/name: kafka }
        - podSelector:
            matchLabels: { app.kubernetes.io/name: postgres }
      ports:
        - { port: 5432 }
        - { port: 9092 }
        - { port: 5672 }
    - ports:
        - { port: 15672 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-accepts-web-and-the-edge
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: api }
  policyTypes: [Ingress]
  ingress:
    - ports: [{ port: 8080 }]
