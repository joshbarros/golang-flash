apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels: { app.kubernetes.io/name: kafka, app.kubernetes.io/part-of: flash }
spec:
  selector: { app.kubernetes.io/name: kafka }
  ports:
    - { name: broker, port: 9092, targetPort: 9092 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels: { app.kubernetes.io/name: kafka, app.kubernetes.io/part-of: flash }
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: kafka }
  template:
    metadata:
      labels: { app.kubernetes.io/name: kafka, app.kubernetes.io/part-of: flash }
    spec:
      terminationGracePeriodSeconds: 60
      securityContext: { fsGroup: 1000 }
      containers:
        - name: kafka
          image: apache/kafka:3.8.1
          ports: [{ name: broker, containerPort: 9092 }]
          env:
            # One KRaft node that is its own controller. Clients reach it through the `kafka` Service.
            - { name: CLUSTER_ID, value: "5bK1xQ0aT3m7Zr9Lw2PyEg" }
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://127.0.0.1:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@127.0.0.1:9093" }
            - { name: KAFKA_NUM_PARTITIONS, value: "1" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
            - { name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data/logs }
            - { name: KAFKA_HEAP_OPTS, value: "-Xmx384m -Xms256m" }
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 20
          resources:
            requests: { cpu: 200m, memory: 640Mi }
            limits: { memory: 900Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 1Gi } }
