# A one-node cluster whose NodePorts are published on 127.0.0.1 only.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: golang-flash
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30108, hostPort: 8112, listenAddress: "127.0.0.1" }   # web
      - { containerPort: 30228, hostPort: 5232, listenAddress: "127.0.0.1" }   # api
      - { containerPort: 30718, hostPort: 15722, listenAddress: "127.0.0.1" }  # RabbitMQ management
