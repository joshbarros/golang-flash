server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Inside the cluster `api` is a Service in the flash namespace. nginx does not use the pod search domains, so the name is spelled out in full and resolved through the cluster DNS, which lets the pod start before the API does.
    resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;

    location /api/ {
        set $api http://api.flash.svc.cluster.local:8080;
        proxy_pass $api$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri $uri/ /index.html;
    }
}
